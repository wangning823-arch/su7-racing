<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>赛道预览工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; }
    .header {
      background: #16213e; padding: 16px 24px;
      border-bottom: 2px solid #0f3460;
      display: flex; align-items: center; gap: 20px;
    }
    .header h1 { font-size: 20px; color: #53d8fb; }
    .main { display: flex; height: calc(100vh - 60px); }
    .sidebar {
      width: 280px; min-width: 280px;
      background: #16213e;
      border-right: 2px solid #0f3460;
      overflow-y: auto; padding: 12px;
    }
    .track-item {
      padding: 10px 14px; margin-bottom: 6px;
      background: #1a1a2e; border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
      border: 2px solid transparent;
    }
    .track-item:hover { background: #0f3460; }
    .track-item.active { background: #0f3460; border-color: #53d8fb; }
    .track-name { font-weight: 600; font-size: 14px; }
    .track-meta { font-size: 11px; color: #888; margin-top: 3px; }
    .track-status {
      display: inline-block; padding: 2px 8px;
      border-radius: 4px; font-size: 10px; font-weight: 700; margin-top: 4px;
    }
    .status-ok { background: #27ae60; color: #fff; }
    .status-cross { background: #e74c3c; color: #fff; }
    .canvas-area { flex: 1; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    .info-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(22,33,62,0.95); padding: 12px 20px;
      border-top: 2px solid #0f3460;
      font-size: 12px; display: flex; gap: 30px; flex-wrap: wrap;
    }
    .info-item { display: flex; gap: 6px; align-items: center; }
    .info-label { color: #888; }
    .info-value { color: #53d8fb; font-weight: 600; }
    .controls {
      position: absolute; top: 12px; right: 12px;
      background: rgba(22,33,62,0.95); padding: 12px 16px;
      border-radius: 8px; border: 1px solid #0f3460;
      display: flex; flex-direction: column; gap: 8px;
    }
    .controls label { font-size: 12px; color: #aaa; cursor: pointer; }
    .controls input[type=checkbox] { accent-color: #53d8fb; }
    .category-label {
      font-size: 10px; color: #53d8fb;
      text-transform: uppercase; letter-spacing: 1px;
      padding: 8px 14px 4px; font-weight: 700;
    }
  </style>
</head>
<body>
<div class="header">
  <h1>&#127937; 赛道预览工具</h1>
  <span style="font-size:12px;color:#888">点击左侧赛道查看布局 | 红色=护栏交叉</span>
  <span id="summaryInfo" style="font-size:12px;color:#27ae60;margin-left:auto"></span>
</div>
<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="controls">
      <label><input type="checkbox" id="showWidth" checked> 显示赛道宽度</label>

      <label><input type="checkbox" id="showPoints" checked> 显示控制点</label>

      <label><input type="checkbox" id="showLabels"> 显示点号</label>
      <label><input type="checkbox" id="showTrees"> 显示树木</label>
      <label><input type="checkbox" id="showBuildings"> 显示建筑</label>
    </div>
    <div class="info-bar" id="infoBar"></div>
  </div>
</div>

  const p1 = pts[i % n];
  const p2 = pts[(i + 1) % n];
  const p3 = pts[(i + 2) % n];
  const tt = frac, tt2 = tt * tt, tt3 = tt2 * tt;
  return [
    0.5 * ((2*p1[0]) + (-p0[0]+p2[0])*tt + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*tt2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*tt3),
    0,
    0.5 * ((2*p1[2]) + (-p0[2]+p2[2])*tt + (2*p0[2]-5*p1[2]+4*p2[2]-p3[2])*tt2 + (-p0[2]+3*p1[2]-3*p2[2]+p3[2])*tt3)
  ];
}

function sampleSpline(pts, count) {
  const result = [];
  for (let i = 0; i < count; i++) {
    result.push(catmullRomPoint(pts, i / count));
  }
  return result;
}

// Distance from point (x,z) to track center (closest segment)
function distToTrack(x, z, pts) {
  let minD = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1)%pts.length];
    const dx = b[0]-a[0], dz = b[2]-a[2];
    const l2 = dx*dx + dz*dz;
    if (l2 < 1e-12) { const d = Math.sqrt((x-a[0])**2+(z-a[2])**2); if(d<minD) minD=d; continue; }
    let t = ((x-a[0])*dx + (z-a[2])*dz) / l2;
    t = Math.max(0, Math.min(1, t));
    const d = Math.sqrt((x-(a[0]+t*dx))**2 + (z-(a[2]+t*dz))**2);
    if (d < minD) minD = d;
  }
  return minD;
}

// Seeded PRNG for reproducible scenery
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const sceneryCache = {};
function generateScenery(track) {
  if (sceneryCache[track.id]) return sceneryCache[track.id];
  const pts = track.points, tw = track.trackWidth, hw = tw/2;
  const theme = track.theme || {};
  const rng = mulberry32(track.id.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0));

  // Track bounds
  let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
  pts.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minZ=Math.min(minZ,p[2]);maxZ=Math.max(maxZ,p[2]);});
  const boundsW=maxX-minX, boundsD=maxZ-minZ;

  // Trees
  const treeCount = theme.trees?.count ?? 400;
  const treeMinDist = theme.trees?.minDistToTrack ?? 18;
  const treeRangeX = Math.max(400, boundsW+160)/2;
  const treeRangeZ = Math.max(400, boundsD+160)/2;
  const trees = [];
  for (let i=0; i<treeCount; i++) {
    let x,z,attempts=0;
    do { x=(rng()-0.5)*treeRangeX*2; z=(rng()-0.5)*treeRangeZ*2; attempts++; }
    while (distToTrack(x,z,pts) < treeMinDist && attempts < 20);
    if (attempts < 20) trees.push({x,z,r:1.5+rng()*2});
  }

  // Buildings
  const buildTheme = theme.buildings || {};
  const buildCount = buildTheme.count ?? 80;
  const buildMinDist = buildTheme.minDistToTrack ?? 10;
  const buildRangeX = Math.max(300, boundsW+120)/2;
  const buildRangeZ = Math.max(300, boundsD+120)/2;
  const buildings = [];
  for (let i=0; i<buildCount; i++) {
    const w = (buildTheme.minWidth??6) + rng()*((buildTheme.maxWidth??14)-(buildTheme.minWidth??6));
    const d = (buildTheme.minWidth??6) + rng()*((buildTheme.maxWidth??14)-(buildTheme.minWidth??6));
    const maxHalf = Math.max(w,d)/2+2;
    const reqDist = Math.max(buildMinDist+hw+maxHalf, hw+6);
    let x,z,attempts=0;
    do { x=(rng()-0.5)*buildRangeX*2; z=(rng()-0.5)*buildRangeZ*2; attempts++; }
    while (distToTrack(x,z,pts) < reqDist && attempts < 100);
    if (attempts < 100) buildings.push({x,z,w,d});
  }

  sceneryCache[track.id] = {trees, buildings};
  return sceneryCache[track.id];
}

function pointToSegDist(p, a, b) {
  const dx = b[0]-a[0], dz = b[2]-a[2];
  const l2 = dx*dx + dz*dz;
  if (l2 < 1e-12) return dist2d(p, a);
  let t = ((p[0]-a[0])*dx + (p[2]-a[2])*dz) / l2;
  t = Math.max(0, Math.min(1, t));
  return dist2d(p, [a[0]+t*dx, 0, a[2]+t*dz]);
}

function segSegDist(a1, a2, b1, b2) {
  return Math.min(
    pointToSegDist(a1, b1, b2),
    pointToSegDist(a2, b1, b2),
    pointToSegDist(b1, a1, a2),
    pointToSegDist(b2, a1, a2)
  );
}

function findCrossings(pts, tw) {
  const threshold = tw + 3;
  const crossings = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    for (let j = i+3; j < n; j++) {
      if (i === 0 && j === n-1) continue;
      const d = segSegDist(pts[i], pts[(i+1)%n], pts[j], pts[(j+1)%n]);
      if (d < threshold) crossings.push({ i, j, d });
    }
  }
  return crossings;
}

// Canvas
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let selectedTrack = null;
const allCrossings = {};

TRACKS.forEach(t => { allCrossings[t.id] = findCrossings(t.points, t.trackWidth); });

const sidebar = document.getElementById('sidebar');
const groups = { easy: [], medium: [], hard: [] };
TRACKS.forEach(t => (groups[t.difficulty] || []).push(t));
const diffLabel = { easy: '简单', medium: '中等', hard: '困难' };
let totalCrossings = 0, totalClean = 0;

Object.keys(groups).forEach(diff => {
  const label = document.createElement('div');
  label.className = 'category-label';
  label.textContent = diffLabel[diff] + ' (' + groups[diff].length + ')';
  sidebar.appendChild(label);
  groups[diff].forEach(track => {
    const cr = allCrossings[track.id].length;
    totalCrossings += cr;
    if (cr === 0) totalClean++;
    const div = document.createElement('div');
    div.className = 'track-item';
    div.dataset.id = track.id;
    div.innerHTML = '<div class="track-name">' + track.name + '</div><div class="track-meta">' + track.id + ' | ' + track.points.length + '点 | 宽' + track.trackWidth + '</div><span class="track-status ' + (cr===0?'status-ok':'status-cross') + '">' + (cr===0?'无交叉':cr+' 处交叉') + '</span>';
    div.onclick = () => selectTrack(track);
    sidebar.appendChild(div);
  });
});

document.getElementById('summaryInfo').textContent = '共' + TRACKS.length + '条赛道 | ' + totalClean + '条无交叉 | ' + totalCrossings + '处交叉';

function selectTrack(track) {
  selectedTrack = track;
  document.querySelectorAll('.track-item').forEach(el => el.classList.toggle('active', el.dataset.id === track.id));
  drawTrack(track);
}

function gc(id) { return document.getElementById(id).checked; }

function drawTrack(track) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, w, h);
  const pts = track.points, tw = track.trackWidth, crossings = allCrossings[track.id];
  let minX=Infinity, maxX=-Infinity, minZ=Infinity, maxZ=-Infinity;
  pts.forEach(p => { minX=Math.min(minX,p[0]); maxX=Math.max(maxX,p[0]); minZ=Math.min(minZ,p[2]); maxZ=Math.max(maxZ,p[2]); });
  const margin = 60; minX-=margin; maxX+=margin; minZ-=margin; maxZ+=margin;
  const rangeX=maxX-minX, rangeZ=maxZ-minZ;
  const scale=Math.min(w/rangeX, h/rangeZ);
  const offX=(w-rangeX*scale)/2, offZ=(h-rangeZ*scale)/2;
  function tx(x){return(x-minX)*scale+offX;} function tz(z){return(z-minZ)*scale+offZ;}
  // Grid
  ctx.strokeStyle='#1a2332'; ctx.lineWidth=0.5;
  for(let gx=Math.ceil(minX/50)*50;gx<=maxX;gx+=50){ctx.beginPath();ctx.moveTo(tx(gx),tz(minZ));ctx.lineTo(tx(gx),tz(maxZ));ctx.stroke();}
  for(let gz=Math.ceil(minZ/50)*50;gz<=maxZ;gz+=50){ctx.beginPath();ctx.moveTo(tx(minX),tz(gz));ctx.lineTo(tx(maxX),tz(gz));ctx.stroke();}
  // Track width
  if(gc('showWidth')){
    ctx.fillStyle='rgba(80,120,160,0.3)';
    ctx.beginPath();
    pts.forEach((p,i)=>{const n=pts[(i+1)%pts.length],dx=n[0]-p[0],dz=n[2]-p[2],l=Math.sqrt(dx*dx+dz*dz)||1,nx=-dz/l*tw/2,nz=dx/l*tw/2;i===0?ctx.moveTo(tx(p[0]+nx),tz(p[2]+nz)):ctx.lineTo(tx(p[0]+nx),tz(p[2]+nz));});
    ctx.closePath();ctx.fill();
    ctx.beginPath();
    pts.forEach((p,i)=>{const n=pts[(i+1)%pts.length],dx=n[0]-p[0],dz=n[2]-p[2],l=Math.sqrt(dx*dx+dz*dz)||1,nx=-dz/l*tw/2,nz=dx/l*tw/2;i===0?ctx.moveTo(tx(p[0]-nx),tz(p[2]-nz)):ctx.lineTo(tx(p[0]-nx),tz(p[2]-nz));});
    ctx.closePath();ctx.fill();
  }
  // Barriers (spline-interpolated, matching game logic)
  if(gc('showBarriers')){
    const hw=tw/2+2; // match game: barrierOffset = hw + 2
    const N=800;
    const sp=sampleSpline(pts,N);
    ctx.strokeStyle='#e74c3c'; ctx.lineWidth=1.5;
    for(const side of [1,-1]){
      ctx.beginPath();
      for(let i=0;i<N;i++){
        const p=sp[i], n=sp[(i+1)%N];
        const dx=n[0]-p[0], dz=n[2]-p[2];
        const l=Math.sqrt(dx*dx+dz*dz)||1;
        const nx=-dz/l*hw*side, nz=dx/l*hw*side;
        i===0?ctx.moveTo(tx(p[0]+nx),tz(p[2]+nz)):ctx.lineTo(tx(p[0]+nx),tz(p[2]+nz));
      }
      ctx.closePath(); ctx.stroke();
    }
  }
  // Centerline
  ctx.strokeStyle='#53d8fb'; ctx.lineWidth=2;
  ctx.beginPath(); pts.forEach((p,i)=>{i===0?ctx.moveTo(tx(p[0]),tz(p[2])):ctx.lineTo(tx(p[0]),tz(p[2]));}); ctx.closePath(); ctx.stroke();
  // Points
  if(gc('showPoints')){
    pts.forEach((p,i)=>{ctx.fillStyle='#f1c40f';ctx.beginPath();ctx.arc(tx(p[0]),tz(p[2]),3,0,Math.PI*2);ctx.fill();if(gc('showLabels')){ctx.fillStyle='#888';ctx.font='9px sans-serif';ctx.fillText(i,tx(p[0])+5,tz(p[2])-5);}});
  }
  // Crossings
  if(gc('showCrossings')&&crossings.length>0){
    crossings.forEach(c=>{
      const p1=pts[c.i],p2=pts[(c.i+1)%pts.length],p3=pts[c.j],p4=pts[(c.j+1)%pts.length];
      ctx.strokeStyle='#ff0000'; ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(tx(p1[0]),tz(p1[2]));ctx.lineTo(tx(p2[0]),tz(p2[2]));ctx.stroke();
      ctx.beginPath();ctx.moveTo(tx(p3[0]),tz(p3[2]));ctx.lineTo(tx(p4[0]),tz(p4[2]));ctx.stroke();
      const cx=(p1[0]+p2[0]+p3[0]+p4[0])/4,cz=(p1[2]+p2[2]+p3[2]+p4[2])/4;
      ctx.fillStyle='#ff0000';ctx.beginPath();ctx.arc(tx(cx),tz(cz),6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',tx(cx),tz(cz));ctx.textAlign='start';ctx.textBaseline='alphabetic';
    });
  }
  // Start marker
  ctx.fillStyle='#27ae60';ctx.beginPath();ctx.arc(tx(pts[0][0]),tz(pts[0][2]),5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('S',tx(pts[0][0]),tz(pts[0][2]));ctx.textAlign='start';ctx.textBaseline='alphabetic';
  // Scenery
  const sc = generateScenery(track);
  if(gc('showTrees')){
    sc.trees.forEach(t=>{
      ctx.fillStyle='rgba(46,125,50,0.7)';
      ctx.beginPath(); ctx.arc(tx(t.x),tz(t.z),t.r,0,Math.PI*2); ctx.fill();
    });
  }
  if(gc('showBuildings')){
    sc.buildings.forEach(b=>{
      ctx.fillStyle='rgba(120,120,140,0.6)';
      ctx.strokeStyle='rgba(160,160,180,0.8)'; ctx.lineWidth=1;
      const sx=tx(b.x-b.w/2), sz=tz(b.z-b.d/2), sw=b.w*scale, sd=b.d*scale;
      ctx.fillRect(sx,sz,sw,sd); ctx.strokeRect(sx,sz,sw,sd);
    });
  }
  // Info
  document.getElementById('infoBar').innerHTML='<div class="info-item"><span class="info-label">赛道:</span><span class="info-value">'+track.name+'</span></div><div class="info-item"><span class="info-label">ID:</span><span class="info-value">'+track.id+'</span></div><div class="info-item"><span class="info-label">难度:</span><span class="info-value">'+track.difficulty+'</span></div><div class="info-item"><span class="info-label">控制点:</span><span class="info-value">'+pts.length+'</span></div><div class="info-item"><span class="info-label">路宽:</span><span class="info-value">'+tw+'</span></div><div class="info-item"><span class="info-label">交叉:</span><span class="info-value" style="color:'+(crossings.length>0?'#e74c3c':'#27ae60')+'">'+crossings.length+'</span></div>';
}

['showWidth','showBarriers','showPoints','showCrossings','showLabels','showTrees','showBuildings'].forEach(id=>{document.getElementById(id).addEventListener('change',()=>{if(selectedTrack)drawTrack(selectedTrack);});});
window.addEventListener('resize',()=>{if(selectedTrack)drawTrack(selectedTrack);});
if(TRACKS.length>0)selectTrack(TRACKS[0]);
</script>
</body>
</html>
